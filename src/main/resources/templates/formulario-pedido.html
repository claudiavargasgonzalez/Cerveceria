<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Administración</title>
    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Estilos adicionales -->
    <style>
        body {
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="bg-gray-100 bg-opacity-75">
    <div class="flex">
        <!-- Barra de navegación -->
        <aside class="h-screen w-20 bg-gray-800 text-white flex flex-col items-center">
            <!-- Botón menú -->
            <div class="my-6">
                <i id="menu-button" class="fas fa-bars text-3xl cursor-pointer"></i>
            </div>
            <!-- Opciones del menú -->
            <nav id="dropdown-menu" class="mt-10 space-y-8">
                <a href="/menu-principal" class="flex items-center justify-center rounded-full p-2 hover:bg-gray-700">
                    <i class="fa-solid fa-house text-2xl"></i>
                </a>
                <a href="/barril" class="flex items-center justify-center rounded-full p-2 hover:bg-gray-700">
                    <i class="fas fa-beer-mug-empty text-2xl"></i>
                </a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <div class="flex-1 p-6">
            <div class="container mx-auto p-6 max-w-4xl">
                <div class="bg-white p-6 rounded-lg shadow-md">
                    <!-- Título -->
                    <h1 class="text-2xl font-bold mb-4">Formulario de Pedido</h1>
                    <!-- Formulario -->
                    <form action="/procesar-pedido" method="post" class="space-y-4">
                        <!-- Cliente -->
                        <div>
                            <label for="cliente" class="block text-sm font-medium text-gray-700">Cliente</label>
                            <input type="text" id="cliente" name="cliente" required 
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <!-- Dirección -->
                        <div>
                            <label for="direccion" class="block text-sm font-medium text-gray-700">Dirección</label>
                            <input type="text" id="direccion" name="direccion" required
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <!-- Teléfono -->
                        <div>
                            <label for="telefono" class="block text-sm font-medium text-gray-700">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" required
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <!-- Cerveza -->
                        <div>
                            <label for="cerveza" class="block text-sm font-medium text-gray-700">Cerveza</label>
                            <select id="cerveza" name="cerveza" required
                                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="rubia">Rubia</option>
                                <option value="negra">Negra</option>
                                <option value="ipa">IPA</option>
                                <option value="roja">Roja</option>
                            </select>
                        </div>
                        <!-- Cantidad -->
                        <div>
                            <label for="cantidad" class="block text-sm font-medium text-gray-700">Cantidad (Litros)</label>
                            <input type="number" id="cantidad" name="cantidad" required min="1"
                                   class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                        </div>
                        <!-- Notas -->
                        <div>
                            <label for="notas" class="block text-sm font-medium text-gray-700">Notas</label>
                            <textarea id="notas" name="notas" rows="4"
                                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm"></textarea>
                        </div>
                        <!-- Botón Enviar -->
                        <div>
                            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                                Enviar Pedido
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
