<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock de Cervezas</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<div class="max-w-4xl mx-auto mt-10 bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-semibold mb-6">Buscar Lotes por Cerveza</h2>

    <form action="/stock/buscar" method="post">
        <div class="mb-4">
            <label for="cervezaId" class="block text-lg font-medium text-gray-700">Selecciona una Cerveza</label>
            <select id="cervezaId" name="cervezaId" class="mt-2 p-2 w-full bg-gray-50 border border-gray-300 rounded-md">
                <option value="">Selecciona una cerveza...</option>
                <th:block th:each="cerveza : ${cervezas}">
                    <option th:value="${cerveza.id}" th:text="${cerveza.nombreCerveza}"></option>
                </th:block>
            </select>
        </div>
        
        <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-md">Buscar</button>
    </form>
</div>

</body>
</html>
